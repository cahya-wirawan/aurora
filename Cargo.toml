[workspace]
resolver = "3"
members = ["crates/*"]
# The vertical slice (PRD §13 Step 4) is throwaway and stays out of the
# workspace, so it cannot accidentally become a dependency of real code.
exclude = ["spike"]

[workspace.package]
# See CLAUDE.md's "Versioning" section: SemVer, minor bumped per PLAN.md
# step, patch bumped per bug fix. A release is a `vX.Y.Z` tag matching
# this exact value, pushed once the bump is committed.
version = "0.70.0"
# Not published: `aurora-core` and `aurora` are taken on crates.io by unrelated
# projects (PRD §12 Q2b), and nothing needs publishing to build or ship the
# application. This also lets cargo-deny's allow-wildcard-paths exempt the
# internal path dependencies, which it declines to do for publishable crates.
publish = false
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/cahya-wirawan/aurora"
authors = ["Cahya Wirawan"]

[workspace.dependencies]
# Internal crates. Layering is enforced by scripts/check_layering.py — adding a
# dependency here does not make it legal, see docs/adr and PRD §7.2.
aurora-core = { path = "crates/aurora-core" }
aurora-tile = { path = "crates/aurora-tile" }
aurora-graph = { path = "crates/aurora-graph" }
aurora-gpu = { path = "crates/aurora-gpu" }
aurora-render = { path = "crates/aurora-render" }
aurora-doc = { path = "crates/aurora-doc" }
aurora-color = { path = "crates/aurora-color" }
aurora-filters = { path = "crates/aurora-filters" }
aurora-brush = { path = "crates/aurora-brush" }
aurora-vector = { path = "crates/aurora-vector" }
aurora-text = { path = "crates/aurora-text" }
aurora-io = { path = "crates/aurora-io" }
aurora-ai = { path = "crates/aurora-ai" }
aurora-plugin = { path = "crates/aurora-plugin" }
aurora-theme = { path = "crates/aurora-theme" }
aurora-widgets = { path = "crates/aurora-widgets" }
aurora-ui = { path = "crates/aurora-ui" }
# Dev-dependency only, for every crate that needs it -- never a real
# dependency of shipped code. See scripts/layering.json.
aurora-testkit = { path = "crates/aurora-testkit" }

# External. Versions are declared centrally so crates cannot drift apart.
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
# ADR 0009's own decision for `.aur`'s manifest/history encoding --
# `use-std` (implies `alloc`) since this is a plain desktop app, not the
# embedded/no_std targets postcard's own default features are aimed at.
postcard = { version = "1", default-features = false, features = ["use-std"] }
toml = "0.9"
half = "2"
# ADR 0008: statically linked via lcms2-sys's vendored build (no dynamic-link
# packaging burden, unlike ADR 0007's RAW decision) -- see spike/raw-icc.
lcms2 = "6.1.1"
lru = "0.18.2"
lz4_flex = "0.11"
# Same pin `spike/a11y-ime` already proved works (accessibility spike,
# PRD §13 Step 4 / ADR 0001's escape-hatch check).
accesskit = "0.24"
# Same pin `spike/a11y-ime` already proved works against accesskit 0.24 --
# the `winit` integration layer aurora-app's window/event loop needs for
# the "create hidden -> attach adapter -> show" ordering ADR 0001's
# escape-hatch check found (accesskit_winit panics if the adapter is
# built after the window is first shown).
accesskit_winit = "0.33"
# Real structural validation for aurora-widgets' own accesskit::TreeUpdate
# output (dev-dependency only) -- the exact library accesskit_winit's
# adapter uses internally, and the one that caught a real "disconnected
# tree" bug (accessibility_update never set node.children) via a crash on
# real macOS hardware. Pure-Rust, no platform backends of its own -- only
# depends on accesskit + hashbrown, so this doesn't compromise the
# headless dependency-graph guarantee `aurora-widgets` documents for its
# own real [dependencies].
accesskit_consumer = "0.38"
# PLAN.md M1.7's own suggestion ("flexbox-style; taffy if it fits").
taffy = "0.12"
# PRD §8's own pre-decided pair ("Vector rasterization | lyon
# (tessellation) + custom GPU path renderer") -- aurora-vector's own
# job is the tessellation half; the GPU renderer is separate, still-
# open follow-on work in whichever crate actually draws it (aurora-
# widgets depends on both aurora-vector and aurora-gpu; aurora-vector
# itself only depends on aurora-core per scripts/layering.json, so it
# stays GPU-agnostic). Default features only (path building +
# tessellation) -- `extra`/`debugger`/`profiling`/`serialization` are
# all off already, nothing here opts into them.
lyon = "1"
# Correct Unicode word-boundary motion for the text field widget, not a
# hand-rolled whitespace heuristic.
unicode-segmentation = "1"
# 3.20 is the real floor, not "3": `Builder::permissions` (used to make
# the tile scratch directory `0o700` at `mkdir` time) arrived in 3.10.0,
# and `TempDir::keep` (the un-deprecated `into_path`, used to hand the
# session scratch directory's path over to the `OnceLock` that outlives
# the guard) in 3.20.0. Left at "3", a `-Z minimal-versions` resolve
# picks 3.0 and neither compiles.
tempfile = "3.20"
criterion = "0.5"
# PRD §8.5's "image-diff golden tests for render correctness" (aurora-testkit):
# encode/decode for golden/actual/diff PNGs. image-rs's own PNG-only crate --
# lighter than the full `image` crate, which this doesn't need.
png = "0.17"
wgpu = "30"
pollster = "1"
# Default features minus `wayland-csd-adwaita`, plus `wayland-csd-adwaita-crossfont`:
# the stock feature renders Wayland's fallback window-decoration title text via
# `sctk-adwaita`'s `ab_glyph` backend, which pulls in `ttf-parser` — confirmed
# unmaintained (RUSTSEC-2026-0192, `cargo deny check advisories`), no safe upgrade
# available. `crossfont` (system font libraries, no `ttf-parser`) is winit's own
# alternative for the same feature, not a fork or a deny.toml exception.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-crossfont",
] }
# PRD §8.3/§14 table: the pre-decided native-dialog crate ("Native
# dialogs | rfd"). Default features (xdg-portal/wayland on Linux) match
# what every other windowing feature in this workspace already opts
# into.
rfd = "0.17"
# System clipboard access (PRD §7's "clipboard is our work, not
# inherited"). Default features off: they pull in `image`/`image-data`
# support this workspace has no use for yet (nothing copies/pastes
# pixels) -- text only, the same "declare only what's used" discipline
# `aurora-widgets`' own headless-mode work already established.
arboard = { version = "3", default-features = false }
# The real per-platform app-support directory for durable user
# preferences (starting with the docked-workspace layout: rail width,
# panel collapsed state) -- unlike `aurora-app`'s own `marker_path`/
# `autosave_path`, which deliberately use `std::env::temp_dir()` for
# genuinely ephemeral crash-recovery data, a layout preference should
# survive a reboot, not just a clean run. Cahya's own choice
# (`AskUserQuestion`) over reusing `temp_dir()` for consistency. MIT OR
# Apache-2.0, no other dependencies of its own.
directories = "6"
# Native menu bar -- macOS only (`aurora-app`'s own Cargo.toml adds this
# as a target-specific dependency, `cfg(target_os = "macos")`). PRD
# §8.3/§14 only name macOS for the native menu bar; on inspection,
# muda's only Linux backend needs a real `gtk::Window` (which a plain
# `winit`-created X11/Wayland window structurally never is, and doesn't
# even compile on Linux without the heavy `gtk` feature for a backend
# that couldn't attach to anything anyway), and Windows needs its own,
# separate `unsafe`-code decision -- both left open. Default features
# off: `gtk`/`libxdo` are Linux-only optional deps, moot on macOS.
muda = { version = "0.19", default-features = false }
# macOS only (`aurora-app`'s own Cargo.toml adds this as a target-
# specific dependency, same as `muda` above) -- `NSWorkspace`'s real
# accessibility-display API (reduced motion, increase contrast),
# PLAN.md M1.8's "OS settings" bullet. Already a transitive dependency
# on this target via `winit`/`muda`/`rfd`/`arboard`'s own macOS
# backends; this promotes it to direct rather than adding new surface
# to the dependency graph. Default features off. `NSWorkspace` alone is
# not enough -- confirmed the hard way (a real cross-compile on Cahya's
# own Mac failed with it alone): the accessibility-display methods
# (`accessibilityDisplayShouldReduceMotion` etc.) live in this crate's
# own generated `NSAccessibility` module, gated behind the separate
# `NSAccessibility` feature, not bundled into `NSWorkspace`. Still a
# safe Rust API either way -- no `unsafe_code` lint override needed.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSWorkspace",
    "NSAccessibility",
] }
# PRD §8.2's pre-decided pair for image codecs ("`image`, `zune-image` |
# Mature, pure Rust") -- `zune-jpeg` is the focused, decode-only member
# of that same `zune-image` family, matching this crate's existing
# "lean, single-purpose codec crate, not the aggregate `image` crate"
# pattern (see the `png` entry above).
zune-jpeg = "0.5"
# `zune-jpeg` is decode-only; encoding needs a separate pure-Rust crate.
# `jpeg-encoder` matches the same "focused, single-purpose" shape.
jpeg-encoder = "0.7"
# `tiff` (`image-tiff` upstream) -- the same image-rs organisation as the
# `png` entry above, and PRD §8.2's own pre-decided pair covers TIFF too
# ("PNG/JPG/TIFF/WebP/GIF/BMP | `image`, `zune-image`"). One crate here
# covers both decode and encode, unlike JPEG's two-crate split.
tiff = "0.11"
# ADR 0009's own container format for `.aur`: default features off, only
# `deflate` enabled -- the format uses exactly two compression methods
# (STORE for the mimetype sniff-entry and already-`lz4_flex`-compressed
# tile payloads; DEFLATE for the postcard-encoded manifest/history,
# which aren't pre-compressed) -- no encryption, no bzip2/lzma/zstd/ppmd,
# none of which `.aur` needs.
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Denied outright: these are the ones that cost a user their work.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Noise in a codebase that is mostly graphics math.
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"

[profile.dev]
opt-level = 1        # Debug builds must still paint at interactive rates.

[profile.dev.package."*"]
opt-level = 3        # Dependencies are not what we debug.

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1            # Keep symbols: crash reports are a reliability requirement (PRD §6).
