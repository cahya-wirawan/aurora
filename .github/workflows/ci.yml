name: CI

# Runs the real gate (.github/workflows/verify.yml) on every push to
# main and every PR — ordinary commits are checked immediately, not only
# at release, per CLAUDE.md's own stated principle ("cross-platform
# breakage is cheap to fix now and catastrophic in month 30"). Tagging a
# release (`.github/workflows/release.yml`) runs the exact same jobs
# again against the tagged commit before creating a GitHub Release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
