name: Verify

# The real gate: format, layering, lint, tests (all three platforms),
# docs, licences/advisories. A reusable workflow (`workflow_call`), not a
# standalone trigger — `ci.yml` calls this on every push/PR, `release.yml`
# calls it again against the exact commit a version tag points at, so a
# release can never skip a check ci.yml itself already runs. Keeping one
# copy of these jobs, not two, is the point: duplicating them across
# ci.yml/release.yml would let the two silently drift apart.

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Cheap checks first, so an obvious failure does not wait on three platforms.
  lint:
    name: Format, lint, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # winit's `wayland-csd-adwaita-crossfont` feature (see workspace Cargo.toml)
      # needs fontconfig's pkg-config file to build `yeslogic-fontconfig-sys`.
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Format
        run: cargo fmt --all --check

      # PRD §7.2: dependencies point downward only. Enforced, not assumed.
      - name: Crate layering
        run: python3 scripts/check_layering.py

      # PRD FR-027 acceptance criterion 3 / invariant §7.3.10: no widget
      # hardcodes a colour or pixel size outside a real design token.
      - name: No hardcoded style values
        run: python3 scripts/check_no_hardcoded_style.py

      # Every other compile step in this file passes `--all-targets` and/or
      # `--all-features`, so none of them build the configuration Aurora
      # actually ships. That gap is not theoretical: `aurora-doc`'s
      # `test-support` feature gates a test-only escape hatch, and a
      # non-test `pub fn` in a shipping crate calling it passed
      # `cargo build --workspace --all-targets` and
      # `cargo check --workspace --all-features` while failing only a
      # plain, flagless build. `check` rather than `build`: the leak is an
      # unresolved path, caught at type-check time, and `check` is the
      # cheap half. `--locked` additionally keeps `Cargo.lock` honest.
      - name: Default-feature check (the configuration that ships)
        run: cargo check --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # winit's `wayland-csd-adwaita-crossfont` feature (see workspace Cargo.toml)
      # needs fontconfig's pkg-config file to build `yeslogic-fontconfig-sys`.
      - name: Install fontconfig
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo nextest run --workspace

      # nextest does not run doctests; they are still documentation that must compile.
      - name: Doctests
        run: cargo test --workspace --doc

  docs:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # winit's `wayland-csd-adwaita-crossfont` feature (see workspace Cargo.toml)
      # needs fontconfig's pkg-config file to build `yeslogic-fontconfig-sys`.
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: rustdoc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licences and advisories
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run on the normal runner rather than cargo-deny-action's musl container,
      # which has no toolchain matching rust-toolchain.toml and errors on it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # PRD §14: Aurora is MIT, and shipped binaries carry their dependencies'
      # terms. Copyleft C libraries need a documented exception, not a silent add.
      - run: cargo deny check all
