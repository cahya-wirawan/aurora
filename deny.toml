# cargo-deny configuration. See PRD §14 for the licensing obligations this enforces.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Aurora is MIT (PRD §14); anything copyleft that ends
# up statically linked would impose terms we have not agreed to.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",          # File-level copyleft; acceptable, we do not modify these.
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # OSI-approved, FSF-libre, permissive (no attribution obligation beyond
    # keeping the notice in source redistributions) -- pulled in by
    # `clipboard-win`/`error-code` (arboard's Windows clipboard backend,
    # PRD §7's "clipboard is our work" / M1.8).
    "BSL-1.0",
    # The Independent JPEG Group's own licence -- permissive (attribution
    # only, same spirit as BSD/MIT), used by libjpeg itself. Pulled in by
    # `jpeg-encoder`'s IJG-derived DCT code (PRD §8.2's pure-Rust image-
    # codec pair, M1.9's JPEG export).
    "IJG",
]
confidence-threshold = 0.9
# The allow list is deliberately forward-looking: most entries are not hit yet
# because the workspace is a skeleton. Unused allowances are not a problem.
unused-allowed-license = "allow"

# LGPL dependencies (LibRaw, libheif — PRD §8.2) are NOT on the allow list. They
# are permissible only when dynamically linked, which cargo-deny cannot verify.
# If one is introduced, add a documented exception here alongside an ADR
# recording how the LGPL relinking obligation is satisfied in packaging.
#
# This risk is not C-library-specific: spike/raw-icc/FINDINGS.md finding 2
# found rawler (the flagship pure-Rust RAW decoder) is ALSO LGPL-2.1, and
# argued Rust static linking makes the relinking obligation harder to
# satisfy than the LibRaw/C case this comment originally had in mind, not
# easier. "Pure Rust" does not imply "avoids this list."
exceptions = []

[bans]
multiple-versions = "warn"
# Wildcards are denied for published crates, but the internal aurora-* crates are
# path dependencies with no version, which cargo-deny counts as wildcards. They
# are never published, so exempting paths keeps the check meaningful for real
# third-party dependencies rather than disabling it outright.
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
