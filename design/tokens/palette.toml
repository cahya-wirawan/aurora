schema_version = 1

# Primitive color ramps. Themes reference these by name (e.g. "neutral.100");
# widgets never see or reference this file — they resolve semantic tokens in
# a theme file (../themes/*.toml), which point in here. Ascending step number
# = ascending lightness, regardless of which theme (dark or light) ends up
# using which end of the ramp.
#
# Draft — Cahya to revise. Starting point only: one accent hue, minimal
# semantic (error/warning/success) ramps. Values were adjusted from an initial
# guess to clear WCAG AA against the Dark theme's surfaces; see
# ../check_contrast.py and ../CONTRAST.md for the numbers.

[neutral]
# Very low chroma, near-black to near-white. "The work is the interface" (PRD
# FR-027) — these must stay quiet enough that they never compete with a
# user's image.
0   = "#141414"
50  = "#1a1a1b"
100 = "#212124"
150 = "#28282c"
200 = "#313136"
300 = "#404048"
400 = "#6e6e76"
500 = "#7a7a83"
600 = "#9d9da5"
700 = "#c1c1c7"
800 = "#e2e2e5"
900 = "#f5f5f6"

[accent.blue]
# Single accent hue for v1 (primary actions, active tool, selection, focus
# ring). Additional accents are a post-Phase-0 decision.
#
# 100/200/300 are the dark end of the same hue -- added for Light (and the
# future high-contrast/Colour-Critical themes) to fill against near-white
# surfaces, the standard light-mode "dark fill, light text" button pattern.
# Dark's own 400/500/600 are untouched and keep meaning what they already
# meant (light accents on Dark's near-black surfaces).
100 = "#0b3f91"
200 = "#124fb0"
300 = "#1a63d1"
400 = "#5b9bff"
500 = "#78acff"
600 = "#a4c8ff"

[semantic.red]
500 = "#ff6b6f"

[semantic.amber]
500 = "#f0a93e"

[semantic.green]
500 = "#4cc272"

[hc]
# Literal, maximum-contrast primitives for the two High Contrast themes only.
# Deliberately separate from [neutral]/[accent.blue], which are tuned to stay
# "quiet" and never reach true black/white/max-saturation on purpose.
black       = "#000000"
white       = "#ffffff"
mid_gray    = "#808080"   # disabled content only -- WCAG-exempt, but still legible
yellow      = "#ffff00"   # primary accent -- near-maximum luminance among fully-saturated hues
yellow_dark = "#c8a000"   # pressed/active accent -- clearly distinct from primary, still bold
red         = "#ff0000"
orange      = "#ffa500"
green       = "#00ff00"

# On-white-legible variants for High Contrast Light. High Contrast Dark's own
# yellow accent and pure red/orange/green read fine against black (yellow
# ≈19.6:1, red 5.25:1, warning 10.63:1, success 15.30:1) but are markedly
# worse against white (4.00:1 / 1.97:1 / 1.37:1 -- green in particular is
# nearly invisible), so High Contrast Light needs its own accent hue and its
# own darker state-color set, not a reuse of High Contrast Dark's.
blue        = "#0000ff"   # primary accent -- illegible-on-white yellow ruled it out; blue is the
                           # conventional OS high-contrast "hyperlink/hot" colour on light backgrounds
blue_dark   = "#00008b"   # pressed/active accent
darkred     = "#cc0000"   # state.error -- pure #ff0000 is only 4.00:1 on white, this is 5.89:1
amber_dark  = "#a05a00"   # state.warning -- pure #ffa500 is only 1.97:1 on white (nearly invisible),
                           # this is 5.31:1
darkgreen   = "#008000"   # state.success -- pure #00ff00 is only 1.37:1 on white (worse), this is 5.14:1

[cc]
# Genuinely neutral (R == G == B, verified by construction, not approximately) primitives
# for the Colour-Critical theme -- PRD.md's own acceptance criterion 8 ("Colour-critical
# theme surfaces are verified neutral"). Deliberately a new table, not [neutral]: that
# ramp has a small, intentional cool tint on every step (check its own entries -- R/G and
# B differ by 1-9 units throughout), the opposite of what this theme needs.
canvas     = "#545454"
app        = "#464646"
panel      = "#3c3c3c"
raised     = "#4c4c4c"
overlay    = "#5a5a5a"
sunken     = "#242424"
white      = "#ffffff"
near_white = "#ebebeb"
light      = "#d6d6d6"
mid_light  = "#c2c2c2"
mid        = "#999999"
border_mid = "#6e6e6e"
near_black = "#1a1a1a"
