schema_version = 1
name = "Dark"
extends = "none" # this is the base theme; Light/High Contrast/Color-Critical extend it
is_default = true

# Every value here is a reference into ../tokens/palette.toml ("<ramp>.<step>"),
# never a literal. Draft — Cahya to revise; contrast-checked but not
# eyeballed for aesthetics yet. Run ../check_contrast.py after any edit here.

[surface]
canvas  = "neutral.0"
app     = "graphite.app"      # 282828 -- gutters, window frame, pasteboard
header  = "graphite.header"   # 424242 -- panel title strips and tab rows
panel   = "graphite.panel"    # 535353 -- panel bodies and chrome strips
raised  = "graphite.raised"   # 585858; lighter than 5e5e5e would drop border.focus below 3:1
overlay = "graphite.overlay"  # 626262
sunken  = "graphite.sunken"   # 3a3a3a -- recessed against panel

[text]
primary   = "neutral.900"
secondary = "graphite.text_secondary"
disabled  = "graphite.disabled"
on_accent = "neutral.0"

[icon]
default   = "neutral.800"
secondary = "graphite.icon_secondary"
disabled  = "graphite.disabled"
on_accent = "neutral.0"

[border]
default = "graphite.border_default"
strong  = "graphite.border_strong"
focus   = "accent.blue.500"
control = "graphite.border_strong"          # reuses border.strong's own reference -- if control_opacity
                                  #   were ever raised above 0, this degrades to something sane
                                  #   rather than an arbitrary colour; see vocabulary.md
control_opacity = 0.0

[accent]
primary        = "accent.blue.500"
primary_hover  = "accent.blue.600"
primary_active = "accent.blue.400"

[state]
error   = "semantic.red.500"
warning = "semantic.amber.500"
success = "semantic.green.500"
disabled_opacity = 0.4

[state.hover_overlay]
color = "neutral.900"
alpha = 0.06

[state.active_overlay]
color = "neutral.900"
alpha = 0.10

# 0.219.0 (design owner Cahya's decision, delegated for the values): the
# marching-ants pair and the Quick Mask overlay. Identical in all five
# themes on purpose -- the ants must read on any image, so they are pure
# white and pure black ([hc] is the palette's only pure pair; the [neutral]
# ramp's ends are #141414 and #f5f5f6), not surface-relative.
[selection]
ants_light = "hc.white"
ants_dark  = "hc.black"

[quick_mask.overlay]
color = "semantic.red.500"
alpha = 0.5

# 0.227.0: the Crop tool's shield over the canvas outside the crop
# rectangle. Black at 0.5, identical in all five themes (Photoshop's
# default shield opacity); not contrast-gated (a dimming, not content).
[crop.shield]
color = "hc.black"
alpha = 0.5
