[package]
name = "aurora-cli"
description = "Headless binary for batch processing and automation."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aurora-core = { workspace = true }
aurora-tile = { workspace = true }
aurora-graph = { workspace = true }
aurora-gpu = { workspace = true }
aurora-render = { workspace = true }
aurora-doc = { workspace = true }
aurora-color = { workspace = true }
aurora-filters = { workspace = true }
aurora-brush = { workspace = true }
aurora-vector = { workspace = true }
aurora-text = { workspace = true }
aurora-io = { workspace = true }
aurora-ai = { workspace = true }
aurora-plugin = { workspace = true }
aurora-commands = { workspace = true }
aurora-mcp = { workspace = true }
# The headless document session (`aurora_app::mcp_session`); no window or GPU is
# created unless a command asks (ADR 0014 records why the CLI depends on the app).
aurora-app = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lib]
name = "aurora_cli"
path = "src/lib.rs"

[[bin]]
name = "aurora-cli"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
aurora-automation = { workspace = true }
tempfile = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }
