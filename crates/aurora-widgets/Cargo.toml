[package]
name = "aurora-widgets"
description = "Document-agnostic widget toolkit: layout, input routing, damage tracking, accessibility."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# aurora-gpu/aurora-vector/aurora-text are allowed here (see
# scripts/layering.json) for the still-open "vector-first rendering"
# M1.7 bullet, but nothing in this crate uses them yet -- add them back
# exactly when that work starts. Keeping them out until then makes
# "headlessly testable" a checkable fact about this crate's own
# dependency graph (`cargo tree -p aurora-widgets -i wgpu` finds
# nothing), not just an inferred property of what happens not to be
# called at runtime.
aurora-core = { workspace = true }
aurora-theme = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
accesskit = { workspace = true }
taffy = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
accesskit_consumer = { workspace = true }
