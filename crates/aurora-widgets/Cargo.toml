[package]
name = "aurora-widgets"
description = "Document-agnostic widget toolkit: layout, input routing, damage tracking, accessibility."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# aurora-text is allowed here (see scripts/layering.json) for the
# still-open "vector-first rendering" M1.7 bullet, but nothing in this
# crate uses it yet -- add it back exactly when that work starts.
#
# aurora-gpu/aurora-vector, and the `wgpu` this pulls in transitively,
# are real now (2026-08-06) -- the GPU path renderer (`render` module).
# The core widget toolkit (layout/input/accessibility) stays exactly as
# headlessly testable as before: its own tests still run with no
# window, no GPU, and no platform accessibility backend, unchanged.
# Only `render`'s own tests need a real adapter, and skip (not fail)
# when this sandbox/CI runner doesn't have one -- the same "headless CI
# still runs everything, real hardware exercises the rest" shape every
# other `wgpu`-touching crate in this workspace already uses, not an
# exception carved out for this one.
aurora-core = { workspace = true }
aurora-gpu = { workspace = true }
aurora-theme = { workspace = true }
aurora-vector = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
accesskit = { workspace = true }
taffy = { workspace = true }
unicode-segmentation = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
# The same `aurora-gpu` already in `[dependencies]` above, with its
# `test-support` feature on -- Cargo allows a package in both positions
# with different feature sets, and a dev-dependency's features only
# reach the graph when dev-targets are actually built. Needed by
# `src/test_support.rs` and `tests/gallery.rs`, so this crate's
# real-GPU tests share one copy of the "skip, or fail because
# `AURORA_REQUIRE_GPU` is set" decision rather than duplicating it.
aurora-gpu = { workspace = true, features = ["test-support"] }
accesskit_consumer = { workspace = true }
aurora-testkit = { workspace = true }
