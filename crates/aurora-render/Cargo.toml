[package]
name = "aurora-render"
description = "Executes the render graph on GPU or CPU, producing progressive tiled output."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aurora-core = { workspace = true }
aurora-tile = { workspace = true }
aurora-graph = { workspace = true }
aurora-gpu = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
# The same `aurora-gpu` already in `[dependencies]` above, with its
# `test-support` feature on -- Cargo allows a package in both positions
# with different feature sets, and a dev-dependency's features only
# reach the graph when dev-targets are actually built. Needed by
# `src/test_support.rs`, so this crate's real-GPU tests share one copy
# of the "skip, or fail because `AURORA_REQUIRE_GPU` is set" decision
# rather than carrying a fifth duplicate of it.
aurora-gpu = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
aurora-testkit = { workspace = true }
# `benches/composite.rs` only -- the measurement half of the "is the CPU
# blend-math loop worth parallelizing?" round. Deliberately a
# dev-dependency: nothing shipped uses it.
criterion = { workspace = true }

[[bench]]
name = "composite"
harness = false
