# THROWAWAY. Deliberately outside the workspace (root Cargo.toml `exclude`s it).
#
# This is PRD §13 Step 4: a narrow slice through the whole stack that exists to
# produce measurements, not to become Aurora. Corners are cut on purpose --
# hardcoded sizes, one blend mode, minimal error handling. Promoting any of this
# into crates/ should be a deliberate decision, not an accident of it working.
[package]
name = "vertical-slice"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }

[profile.dev]
opt-level = 2          # A debug build must still paint; measurements need it.

[profile.dev.package."*"]
opt-level = 3
